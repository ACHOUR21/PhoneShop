# ============================================================
# PhoneShop Pro - Fly.io config
# Launch:  fly launch (reuse this file) → fly volumes create →
#          fly secrets set → fly deploy. See DEPLOY.md.
# ============================================================

app = "phoneshop-pro"
primary_region = "cdg" # Paris — closest to Algeria; change if you like

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[mounts]]
  source = "phoneshop_data"
  destination = "/app/data"

[env]
  DATABASE_URL = "file:/app/data/prod.db"
  NEXT_PUBLIC_DEFAULT_LANGUAGE = "ar"

[deploy]
  release_command = "node -e \"console.log('release ok')\""
